<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#03030A"/>
      <stop offset="100%" style="stop-color:#0a0a18"/>
    </linearGradient>

    <!-- Gold accent gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffc56c"/>
      <stop offset="50%" style="stop-color:#ffe4a0"/>
      <stop offset="100%" style="stop-color:#ffc56c"/>
    </linearGradient>

    <!-- Orb glow filter -->
    <filter id="glow1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="80" result="blur"/>
    </filter>
    <filter id="textGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="subtleGlow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Grain texture -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>

    <clipPath id="clip">
      <rect width="1200" height="630"/>
    </clipPath>
  </defs>

  <!-- BG -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Ambient orbs -->
  <ellipse cx="200" cy="150" rx="320" ry="280" fill="#ffc56c" opacity="0.07" filter="url(#glow2)"/>
  <ellipse cx="1050" cy="500" rx="280" ry="240" fill="#89ceff" opacity="0.06" filter="url(#glow2)"/>
  <ellipse cx="750" cy="200" rx="200" ry="180" fill="#00ed7d" opacity="0.04" filter="url(#glow2)"/>

  <!-- Subtle grid lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1" clip-path="url(#clip)">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Left accent bar -->
  <rect x="72" y="160" width="4" height="310" fill="url(#goldGrad)" rx="2" opacity="0.9"/>

  <!-- Logo mark box -->
  <rect x="72" y="160" width="96" height="96" rx="20" fill="#ffc56c" opacity="0.12"/>
  <rect x="72" y="160" width="96" height="96" rx="20" fill="none" stroke="#ffc56c" stroke-width="1.5" opacity="0.4"/>
  <text x="120" y="221" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="28" fill="#ffc56c" letter-spacing="-1">90TC</text>

  <!-- Main number — huge cinematic "90" -->
  <text x="72" y="430" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="310" fill="rgba(255,197,108,0.07)" letter-spacing="-20" clip-path="url(#clip)">90</text>

  <!-- Headline -->
  <text x="72" y="330" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="88" font-style="italic" fill="url(#goldGrad)" letter-spacing="-2" filter="url(#subtleGlow)">TAGE</text>
  <text x="72" y="430" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="88" font-style="italic" fill="#ffffff" letter-spacing="-2" opacity="0.95">CHALLENGE</text>

  <!-- Gold divider -->
  <rect x="72" y="455" width="120" height="3" rx="2" fill="url(#goldGrad)"/>

  <!-- Tagline -->
  <text x="72" y="502" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="26" fill="rgba(228,225,239,0.6)" letter-spacing="2">Kein Bullshit. Nur Ergebnisse.</text>

  <!-- Right side — stats decorative -->
  <g transform="translate(780, 160)" opacity="0.85">
    <!-- Card 1 -->
    <rect width="160" height="80" rx="16" fill="rgba(255,197,108,0.08)" stroke="rgba(255,197,108,0.2)" stroke-width="1"/>
    <text x="80" y="34" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#ffc56c">90</text>
    <text x="80" y="58" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="rgba(228,225,239,0.5)" letter-spacing="2">TAGE</text>

    <!-- Card 2 -->
    <rect x="180" width="160" height="80" rx="16" fill="rgba(137,206,255,0.08)" stroke="rgba(137,206,255,0.2)" stroke-width="1"/>
    <text x="260" y="34" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#89ceff">∞</text>
    <text x="260" y="58" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="rgba(228,225,239,0.5)" letter-spacing="2">GOALS</text>

    <!-- Card 3 — below -->
    <rect y="100" width="160" height="80" rx="16" fill="rgba(0,237,125,0.08)" stroke="rgba(0,237,125,0.2)" stroke-width="1"/>
    <text x="80" y="134" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#00ed7d">100%</text>
    <text x="80" y="158" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="rgba(228,225,239,0.5)" letter-spacing="2">COMMITMENT</text>

    <!-- Card 4 -->
    <rect x="180" y="100" width="160" height="80" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="260" y="134" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#ffffff" opacity="0.8">🔥</text>
    <text x="260" y="158" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="rgba(228,225,239,0.5)" letter-spacing="2">STREAK</text>

    <!-- Big circle decoration -->
    <circle cx="175" cy="310" r="140" fill="none" stroke="rgba(255,197,108,0.08)" stroke-width="1.5"/>
    <circle cx="175" cy="310" r="110" fill="none" stroke="rgba(255,197,108,0.05)" stroke-width="1"/>
    <circle cx="175" cy="310" r="80" fill="rgba(255,197,108,0.04)"/>
    <text x="175" y="295" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#ffc56c" font-style="italic">90</text>
    <text x="175" y="335" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="rgba(228,225,239,0.4)" letter-spacing="3">TAGE</text>
  </g>

  <!-- Bottom domain/URL hint -->
  <text x="76" y="590" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="rgba(172,169,183,0.35)" letter-spacing="1">90TC — Dein persönliches Fitness-Tagebuch</text>

  <!-- Grain overlay -->
  <rect width="1200" height="630" fill="rgba(255,255,255,0.015)" filter="url(#grain)" opacity="0.4"/>

  <!-- Vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="0%" style="stop-color:transparent"/>
    <stop offset="100%" style="stop-color:#03030A" stop-opacity="0.6"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#vignette)"/>
</svg>
