<body>
<div id="app">
  <div class="splash">
    <div class="splash-logo">🔥</div>
    <div class="spinner"></div>
    <div class="splash-text">90 TAGE CHALLENGE</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script>
  // Fallback: wenn nach 5s nichts passiert → login
  const fallback = setTimeout(() => { window.location.href = 'login.html' }, 5000)

  ;(async () => {
    try {
      const { data: { session } } = await sb.auth.getSession()
      clearTimeout(fallback)
      if (!session) { window.location.href = 'login.html'; return }
      const { data: profile, error: profileErr } = await sb.from('profiles').select('id').eq('id', session.user.id).maybeSingle()
      if (profileErr) { window.location.href = 'login.html'; return }
      window.location.href = profile ? 'dashboard.html' : 'onboarding.html'
    } catch(e) {
      clearTimeout(fallback)
      window.location.href = 'login.html'
    }
  })()
</script>
</body>
