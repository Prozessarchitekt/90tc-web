<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>90TC</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff6b35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="90TC">
  <link rel="apple-touch-icon" href="icon.svg">
</head>
<body>
<div id="app">
  <div class="splash">
    <div class="splash-logo">🔥</div>
    <div class="spinner"></div>
    <div class="splash-text">90 TAGE CHALLENGE</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script>
  // Fallback: wenn nach 5s nichts passiert → login
  const fallback = setTimeout(() => { window.location.href = 'login.html' }, 5000)

  ;(async () => {
    try {
      const { data: { session } } = await sb.auth.getSession()
      clearTimeout(fallback)
      if (!session) { window.location.href = 'login.html'; return }
      const { data: profile } = await sb.from('profiles').select('id').eq('id', session.user.id).maybeSingle()
      window.location.href = profile ? 'dashboard.html' : 'onboarding.html'
    } catch(e) {
      clearTimeout(fallback)
      window.location.href = 'login.html'
    }
  })()
</script>
</body>
</html>
