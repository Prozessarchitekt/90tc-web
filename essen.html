<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>90TC — Mahlzeiten</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff6b35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="90TC">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    .scan-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: var(--accent); color: #fff; border: none;
      border-radius: var(--r-md); padding: 16px; font-size: 16px;
      font-weight: 800; width: 100%; cursor: pointer; margin-bottom: 10px;
    }
    .search-wrap {
      display: flex; gap: 8px; margin-bottom: 16px;
    }
    .search-wrap input {
      flex: 1;
    }
    .search-wrap button {
      background: var(--surface2); border: 1.5px solid var(--border2);
      border-radius: var(--r-sm); padding: 0 16px; color: var(--text);
      font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    #scanner-wrap {
      border-radius: var(--r-md); overflow: hidden; margin-bottom: 16px;
      display: none;
    }
    #reader { width: 100%; }
    .produkt-card {
      background: var(--surface); border-radius: var(--r-md);
      padding: 14px; margin-bottom: 12px;
    }
    .produkt-name {
      font-weight: 800; font-size: 16px; margin-bottom: 4px;
    }
    .produkt-brand {
      font-size: 12px; color: var(--muted); margin-bottom: 10px;
    }
    .nw-grid {
      display: grid; grid-template-columns: repeat(4,1fr); gap: 6px;
      margin-bottom: 14px;
    }
    .nw-box {
      background: var(--bg); border-radius: var(--r-sm);
      padding: 8px 4px; text-align: center;
    }
    .nw-val { font-size: 14px; font-weight: 900; }
    .nw-lbl { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .mahlzeit-tabs {
      display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap;
    }
    .mahlzeit-tab {
      padding: 6px 12px; border-radius: 20px; border: 1.5px solid var(--border2);
      background: transparent; color: var(--text2); font-size: 12px;
      font-weight: 700; cursor: pointer;
    }
    .mahlzeit-tab.active {
      background: var(--accent); border-color: var(--accent); color: #fff;
    }
    .meal-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .meal-item:last-child { border-bottom: none; }
    .meal-icon { font-size: 20px; width: 28px; text-align: center; flex-shrink: 0; }
    .meal-info { flex: 1; min-width: 0; }
    .meal-name { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meal-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .meal-kcal { font-size: 14px; font-weight: 700; color: var(--gold2); flex-shrink: 0; }
    .meal-del { color: var(--danger); font-size: 18px; cursor: pointer; padding: 4px; flex-shrink: 0; }
    .total-bar { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
    .total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .total-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .total-macros { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
    .total-box { text-align: center; }
    .total-val { font-size: 18px; font-weight: 900; }
    .total-lbl { font-size: 10px; color: var(--muted); }
    .search-results { margin-bottom: 16px; }
    .search-result-item {
      padding: 12px; background: var(--surface); border-radius: var(--r-sm);
      margin-bottom: 8px; cursor: pointer;
    }
    .search-result-item:active { opacity: .7; }
    .no-result { text-align: center; padding: 24px; color: var(--muted); font-size: 14px; }
    .menge-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
    .menge-row input { width: 90px; }
    .menge-row .input-unit { font-size: 14px; color: var(--muted); }
    .img-thumb {
      width: 48px; height: 48px; object-fit: cover;
      border-radius: var(--r-sm); flex-shrink: 0;
    }
    .transfer-btn {
      width: 100%; padding: 14px; background: var(--surface2);
      border: 1.5px solid var(--border2); border-radius: var(--r-md);
      color: var(--text); font-size: 14px; font-weight: 700;
      cursor: pointer; margin-top: 4px;
    }
    .transfer-btn:active { opacity: .7; }
  </style>
</head>
<body>
<div id="app">
  <div class="splash" id="loading"><div class="spinner"></div></div>
  <div id="main" style="display:none">
    <div class="page">
      <div class="page-header">
        <a href="checkin.html" class="page-back">←</a>
        <div>
          <div class="page-title">🍽️ Mahlzeiten</div>
          <div class="page-subtitle" id="page-sub">Heute · Tag ?</div>
        </div>
        <div style="width:40px"></div>
      </div>

      <!-- Scanner -->
      <button class="scan-btn" onclick="toggleScanner()">
        <span id="scan-btn-icon">📷</span>
        <span id="scan-btn-text">Barcode scannen</span>
      </button>

      <!-- Textsuche -->
      <div class="search-wrap">
        <input type="text" id="search-input" placeholder="Produkt suchen..." onkeydown="if(event.key==='Enter')doSearch()">
        <button onclick="doSearch()">Suchen</button>
      </div>

      <!-- Scanner-Bereich -->
      <div id="scanner-wrap">
        <div id="reader"></div>
      </div>

      <!-- Suchergebnisse -->
      <div id="search-results" class="search-results" style="display:none"></div>

      <!-- Produkt-Eingabe -->
      <div id="produkt-card" class="produkt-card" style="display:none">
        <div style="display:flex;gap:10px;align-items:flex-start">
          <img id="produkt-img" class="img-thumb" style="display:none" alt="">
          <div style="flex:1">
            <div class="produkt-name" id="produkt-name">—</div>
            <div class="produkt-brand" id="produkt-brand"></div>
          </div>
        </div>
        <div class="nw-grid" id="nw-grid"></div>

        <div class="menge-row">
          <div class="input-group" style="margin:0">
            <label class="input-label">Menge</label>
            <div class="input-with-unit">
              <input type="number" id="menge-input" value="100" min="1" max="9999" oninput="updateNW()">
              <span class="input-unit">g</span>
            </div>
          </div>
        </div>

        <!-- Mahlzeit auswählen -->
        <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px">Mahlzeit</div>
        <div class="mahlzeit-tabs" id="mahlzeit-tabs">
          <button class="mahlzeit-tab active" onclick="selectMahlzeit('frühstück',this)">🌅 Frühstück</button>
          <button class="mahlzeit-tab" onclick="selectMahlzeit('mittagessen',this)">☀️ Mittag</button>
          <button class="mahlzeit-tab" onclick="selectMahlzeit('abendessen',this)">🌙 Abend</button>
          <button class="mahlzeit-tab" onclick="selectMahlzeit('snack',this)">🍎 Snack</button>
        </div>

        <!-- Berechnete Werte -->
        <div class="nw-grid" id="calc-grid" style="margin-bottom:14px"></div>

        <button class="btn btn-primary" onclick="addMeal()" style="width:100%">+ Hinzufügen</button>
        <button class="btn btn-ghost" onclick="clearProduct()" style="width:100%;margin-top:8px">Abbrechen</button>
      </div>

      <!-- Tagesübersicht -->
      <div class="card mb-12" id="tages-card">
        <div class="card-title">HEUTE</div>
        <div id="meal-list">
          <div class="no-result" id="empty-hint">Noch keine Mahlzeiten eingetragen</div>
        </div>
        <div class="total-bar" id="total-bar" style="display:none">
          <div class="total-row">
            <span class="total-label">Gesamt heute</span>
          </div>
          <div class="total-macros">
            <div class="total-box"><div class="total-val" style="color:var(--gold2)" id="t-kcal">0</div><div class="total-lbl">kcal</div></div>
            <div class="total-box"><div class="total-val" style="color:var(--accent)" id="t-prot">0g</div><div class="total-lbl">Protein</div></div>
            <div class="total-box"><div class="total-val" style="color:var(--purple)" id="t-fett">0g</div><div class="total-lbl">Fett</div></div>
            <div class="total-box"><div class="total-val" style="color:var(--green2)" id="t-carbs">0g</div><div class="total-lbl">Carbs</div></div>
          </div>
          <button class="transfer-btn" onclick="transferToCheckin()">
            ✅ Makros in Check-in übertragen
          </button>
        </div>
      </div>

      <div style="height:88px"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="js/config.js"></script>
<script src="js/gamification.js"></script>
<script src="js/auth.js"></script>
<script>
let currentUser = null
let currentProfile = null
let todayMeals = []
let currentProduct = null
let currentMahlzeit = 'frühstück'
let scanner = null
let scannerActive = false
let tagNr = 1

const MAHLZEIT_ICON = { frühstück:'🌅', mittagessen:'☀️', abendessen:'🌙', snack:'🍎' }

// ── Open Food Facts ──────────────────────────────────────────
async function lookupBarcode(barcode) {
  try {
    // Deutsch-first: de.openfoodfacts.org
    const res = await fetch(`https://de.openfoodfacts.org/api/v0/product/${barcode}.json`)
    const data = await res.json()
    if (data.status === 1) return parseProduct(data.product)

    // Fallback: world
    const res2 = await fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`)
    const data2 = await res2.json()
    if (data2.status === 1) return parseProduct(data2.product)

    return null
  } catch(e) { return null }
}

async function searchProducts(query) {
  try {
    const url = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&cc=de&lc=de&action=process&json=1&page_size=15&fields=product_name,product_name_de,brands,nutriments,image_small_url,code`
    const res = await fetch(url)
    const data = await res.json()
    return (data.products || []).filter(p => p.product_name || p.product_name_de).map(parseProduct)
  } catch(e) { return [] }
}

function parseProduct(p) {
  const n = p.nutriments || {}
  const kcal = n['energy-kcal_100g'] ?? (n['energy_100g'] ? Math.round(n['energy_100g'] / 4.184) : null)
  return {
    name: p.product_name_de || p.product_name || '—',
    brand: p.brands || '',
    barcode: p.code || p._id || '',
    image: p.image_small_url || p.image_front_small_url || null,
    kcal100: kcal,
    protein100: n.proteins_100g ?? null,
    fett100: n.fat_100g ?? null,
    carbs100: n.carbohydrates_100g ?? null,
  }
}

// ── Scanner ──────────────────────────────────────────────────
function toggleScanner() {
  if (scannerActive) {
    stopScanner()
  } else {
    startScanner()
  }
}

function startScanner() {
  document.getElementById('scanner-wrap').style.display = 'block'
  document.getElementById('scan-btn-icon').textContent = '⏹️'
  document.getElementById('scan-btn-text').textContent = 'Scanner stoppen'
  scannerActive = true

  scanner = new Html5Qrcode('reader')
  scanner.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: { width: 280, height: 120 } },
    async (barcode) => {
      stopScanner()
      showToast('Barcode erkannt — suche Produkt...')
      const p = await lookupBarcode(barcode)
      if (p) {
        showProduct(p)
      } else {
        showToast('Produkt nicht gefunden — bitte manuell suchen', 'error')
      }
    },
    () => {}
  ).catch(e => {
    showToast('Kamera nicht verfügbar: ' + e, 'error')
    stopScanner()
  })
}

function stopScanner() {
  if (scanner) {
    scanner.stop().catch(() => {})
    scanner = null
  }
  document.getElementById('scanner-wrap').style.display = 'none'
  document.getElementById('scan-btn-icon').textContent = '📷'
  document.getElementById('scan-btn-text').textContent = 'Barcode scannen'
  scannerActive = false
}

// ── Suche ────────────────────────────────────────────────────
async function doSearch() {
  const q = document.getElementById('search-input').value.trim()
  if (!q) return
  const resultsEl = document.getElementById('search-results')
  resultsEl.style.display = 'block'
  resultsEl.innerHTML = '<div class="no-result">Suche läuft...</div>'

  const results = await searchProducts(q)
  if (!results.length) {
    resultsEl.innerHTML = '<div class="no-result">Keine Produkte gefunden</div>'
    return
  }

  resultsEl.innerHTML = results.map((p, i) => `
    <div class="search-result-item" onclick="selectSearchResult(${i})">
      <div style="display:flex;gap:10px;align-items:center">
        ${p.image ? `<img src="${p.image}" class="img-thumb" alt="">` : '<div class="img-thumb" style="background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:20px">🍽️</div>'}
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name}</div>
          <div style="font-size:12px;color:var(--muted)">${p.brand || ''}</div>
          <div style="font-size:12px;color:var(--text2);margin-top:2px">
            ${p.kcal100 != null ? p.kcal100 + ' kcal' : '—'} · P: ${p.protein100 != null ? p.protein100 + 'g' : '—'} · F: ${p.fett100 != null ? p.fett100 + 'g' : '—'} · C: ${p.carbs100 != null ? p.carbs100 + 'g' : '—'} <span style="color:var(--muted)">/ 100g</span>
          </div>
        </div>
      </div>
    </div>
  `).join('')

  // Cache results for selection
  window._searchResults = results
}

function selectSearchResult(i) {
  const p = window._searchResults[i]
  document.getElementById('search-results').style.display = 'none'
  document.getElementById('search-input').value = ''
  showProduct(p)
}

// ── Produkt anzeigen ─────────────────────────────────────────
function showProduct(p) {
  currentProduct = p
  document.getElementById('produkt-card').style.display = 'block'
  document.getElementById('produkt-name').textContent = p.name
  document.getElementById('produkt-brand').textContent = p.brand || ''

  const img = document.getElementById('produkt-img')
  if (p.image) { img.src = p.image; img.style.display = 'block' }
  else img.style.display = 'none'

  // Nährwerte pro 100g
  document.getElementById('nw-grid').innerHTML = `
    <div class="nw-box"><div class="nw-val" style="color:var(--gold2)">${p.kcal100 ?? '—'}</div><div class="nw-lbl">kcal</div></div>
    <div class="nw-box"><div class="nw-val" style="color:var(--accent)">${p.protein100 ?? '—'}g</div><div class="nw-lbl">Protein</div></div>
    <div class="nw-box"><div class="nw-val" style="color:var(--purple)">${p.fett100 ?? '—'}g</div><div class="nw-lbl">Fett</div></div>
    <div class="nw-box"><div class="nw-val" style="color:var(--green2)">${p.carbs100 ?? '—'}g</div><div class="nw-lbl">Carbs</div></div>
    <div style="grid-column:1/-1;font-size:10px;color:var(--muted);text-align:right">pro 100g</div>
  `

  document.getElementById('menge-input').value = 100
  updateNW()
  document.getElementById('menge-input').focus()
  document.getElementById('produkt-card').scrollIntoView({ behavior: 'smooth' })
}

function updateNW() {
  if (!currentProduct) return
  const g = parseFloat(document.getElementById('menge-input').value) || 0
  const f = g / 100
  const p = currentProduct
  document.getElementById('calc-grid').innerHTML = `
    <div class="nw-box"><div class="nw-val" style="color:var(--gold2)">${p.kcal100 != null ? Math.round(p.kcal100 * f) : '—'}</div><div class="nw-lbl">kcal</div></div>
    <div class="nw-box"><div class="nw-val" style="color:var(--accent)">${p.protein100 != null ? Math.round(p.protein100 * f * 10) / 10 : '—'}g</div><div class="nw-lbl">Protein</div></div>
    <div class="nw-box"><div class="nw-val" style="color:var(--purple)">${p.fett100 != null ? Math.round(p.fett100 * f * 10) / 10 : '—'}g</div><div class="nw-lbl">Fett</div></div>
    <div class="nw-box"><div class="nw-val" style="color:var(--green2)">${p.carbs100 != null ? Math.round(p.carbs100 * f * 10) / 10 : '—'}g</div><div class="nw-lbl">Carbs</div></div>
    <div style="grid-column:1/-1;font-size:10px;color:var(--muted);text-align:right">für ${g}g</div>
  `
}

function selectMahlzeit(val, btn) {
  currentMahlzeit = val
  document.querySelectorAll('.mahlzeit-tab').forEach(b => b.classList.remove('active'))
  btn.classList.add('active')
}

function clearProduct() {
  currentProduct = null
  document.getElementById('produkt-card').style.display = 'none'
}

// ── Mahlzeit hinzufügen ──────────────────────────────────────
async function addMeal() {
  if (!currentProduct) return
  const g = parseFloat(document.getElementById('menge-input').value) || 100
  const f = g / 100
  const p = currentProduct

  const meal = {
    user_id: currentUser.id,
    datum: getToday(),
    mahlzeit: currentMahlzeit,
    produkt_name: p.name,
    barcode: p.barcode || null,
    menge_g: g,
    kcal_100g: p.kcal100,
    protein_100g: p.protein100,
    fett_100g: p.fett100,
    carbs_100g: p.carbs100,
    kalorien: p.kcal100 != null ? Math.round(p.kcal100 * f) : null,
    protein_g: p.protein100 != null ? Math.round(p.protein100 * f * 10) / 10 : null,
    fett_g: p.fett100 != null ? Math.round(p.fett100 * f * 10) / 10 : null,
    carbs_g: p.carbs100 != null ? Math.round(p.carbs100 * f * 10) / 10 : null,
  }

  const { data, error } = await sb.from('meal_entries').insert(meal).select().single()
  if (error) { showToast(error.message, 'error'); return }

  todayMeals.push(data)
  clearProduct()
  renderMeals()
  await syncTotals()
  showToast('Hinzugefügt ✓')
}

async function deleteMeal(id) {
  await sb.from('meal_entries').delete().eq('id', id)
  todayMeals = todayMeals.filter(m => m.id !== id)
  renderMeals()
  await syncTotals()
  showToast('Entfernt')
}

// ── Tagesübersicht rendern ────────────────────────────────────
function renderMeals() {
  const list = document.getElementById('meal-list')
  const empty = document.getElementById('empty-hint')
  const totalBar = document.getElementById('total-bar')

  if (!todayMeals.length) {
    empty.style.display = 'block'
    totalBar.style.display = 'none'
    list.innerHTML = '<div class="no-result" id="empty-hint">Noch keine Mahlzeiten eingetragen</div>'
    return
  }

  // Gruppieren nach Mahlzeit
  const order = ['frühstück','mittagessen','abendessen','snack']
  const grouped = {}
  order.forEach(m => { grouped[m] = todayMeals.filter(e => e.mahlzeit === m) })

  let html = ''
  order.forEach(cat => {
    if (!grouped[cat].length) return
    html += `<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 0 4px">${MAHLZEIT_ICON[cat]} ${cat.charAt(0).toUpperCase() + cat.slice(1)}</div>`
    grouped[cat].forEach(m => {
      html += `
        <div class="meal-item">
          <div class="meal-info">
            <div class="meal-name">${m.produkt_name}</div>
            <div class="meal-sub">${m.menge_g}g · P: ${m.protein_g ?? '—'}g · F: ${m.fett_g ?? '—'}g · C: ${m.carbs_g ?? '—'}g</div>
          </div>
          <div class="meal-kcal">${m.kalorien ?? '—'}</div>
          <div class="meal-del" onclick="deleteMeal('${m.id}')">🗑</div>
        </div>`
    })
  })

  list.innerHTML = html

  // Totale
  const totals = todayMeals.reduce((acc, m) => ({
    kcal: acc.kcal + (m.kalorien || 0),
    prot: acc.prot + (m.protein_g || 0),
    fett: acc.fett + (m.fett_g || 0),
    carbs: acc.carbs + (m.carbs_g || 0),
  }), { kcal: 0, prot: 0, fett: 0, carbs: 0 })

  document.getElementById('t-kcal').textContent  = Math.round(totals.kcal)
  document.getElementById('t-prot').textContent  = Math.round(totals.prot * 10) / 10 + 'g'
  document.getElementById('t-fett').textContent  = Math.round(totals.fett * 10) / 10 + 'g'
  document.getElementById('t-carbs').textContent = Math.round(totals.carbs * 10) / 10 + 'g'
  totalBar.style.display = 'block'
}

// ── Makros automatisch in daily_entries schreiben ────────────
async function syncTotals() {
  const totals = todayMeals.reduce((acc, m) => ({
    kcal: acc.kcal + (m.kalorien || 0),
    prot: acc.prot + (m.protein_g || 0),
    fett: acc.fett + (m.fett_g || 0),
    carbs: acc.carbs + (m.carbs_g || 0),
  }), { kcal: 0, prot: 0, fett: 0, carbs: 0 })

  const today = getToday()

  const { data: existing } = await sb.from('daily_entries')
    .select('id').eq('user_id', currentUser.id).eq('datum', today).maybeSingle()

  if (existing) {
    await sb.from('daily_entries').update({
      kalorien_ist:  Math.round(totals.kcal),
      protein_ist_g: Math.round(totals.prot),
      fett_ist_g:    Math.round(totals.fett),
      carbs_ist_g:   Math.round(totals.carbs),
    }).eq('id', existing.id)
  } else {
    await sb.from('daily_entries').insert({
      user_id:       currentUser.id,
      datum:         today,
      tag_nr:        tagNr,
      kalorien_ist:  Math.round(totals.kcal),
      protein_ist_g: Math.round(totals.prot),
      fett_ist_g:    Math.round(totals.fett),
      carbs_ist_g:   Math.round(totals.carbs),
    })
  }
}

async function transferToCheckin() {
  await syncTotals()
  showToast('Makros übertragen ✓')
  setTimeout(() => window.location.href = 'checkin.html', 1000)
}

// ── Init ─────────────────────────────────────────────────────
async function init() {
  const ctx = await requireProfile()
  if (!ctx) return
  currentUser    = ctx.user
  currentProfile = ctx.profile

  const dayNr = calcDayNr(currentProfile.startdatum)
  tagNr = dayNr
  document.getElementById('page-sub').textContent = `Heute · Tag ${dayNr}`

  // Mahlzeit vorauswählen nach Uhrzeit
  const h = new Date().getHours()
  if (h < 10)       currentMahlzeit = 'frühstück'
  else if (h < 14)  currentMahlzeit = 'mittagessen'
  else if (h < 19)  currentMahlzeit = 'abendessen'
  else              currentMahlzeit = 'snack'
  document.querySelectorAll('.mahlzeit-tab').forEach(b => {
    b.classList.toggle('active', b.textContent.toLowerCase().includes(currentMahlzeit.substring(0,4)))
  })

  // Heutige Mahlzeiten laden
  const { data: meals } = await sb.from('meal_entries')
    .select('*').eq('user_id', currentUser.id).eq('datum', getToday())
    .order('created_at')
  todayMeals = meals || []
  renderMeals()

  document.getElementById('loading').style.display = 'none'
  document.getElementById('main').style.display = 'block'
}

init()
</script>
