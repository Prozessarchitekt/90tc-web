<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>90TC — Login</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffc56c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="90TC">
  <link rel="apple-touch-icon" href="icon.svg">

  <!-- Open Graph / Social Preview -->
  <meta property="og:type"        content="website">
  <meta property="og:site_name"   content="90TC — 90 Tage Challenge">
  <meta property="og:url"         content="https://90tc-web.vercel.app/login.html">
  <meta property="og:title"       content="90TC — Deine 90-Tage-Transformation">
  <meta property="og:description" content="Kein Bullshit. Nur Ergebnisse. Dein persönliches Fitness-Tagebuch für die 90-Tage-Challenge — Training, Ernährung, Fortschritt.">
  <meta property="og:image"       content="https://90tc-web.vercel.app/og-image.svg">
  <meta property="og:image:width"  content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale"      content="de_DE">
  <!-- Twitter / X -->
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="90TC — Deine 90-Tage-Transformation">
  <meta name="twitter:description" content="Kein Bullshit. Nur Ergebnisse. Training · Ernährung · Fortschritt.">
  <meta name="twitter:image"       content="https://90tc-web.vercel.app/og-image.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #03030A;
      --card: #0D0D17;
      --border: rgba(255,255,255,0.08);
      --border2: rgba(255,255,255,0.13);
      --text: #e4e1ef;
      --text2: #aca9b7;
      --accent: #ffc56c;
      --accent2: #cb9743;
      --danger: #ff6b6b;
      --green: #00ed7d;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: stretch;
      overflow-y: auto;
    }

    /* ── Background ── */
    .bg-canvas {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    .bg-canvas::before {
      content: '';
      position: absolute;
      top: -10%; left: -10%;
      width: 70%; height: 70%;
      background: radial-gradient(ellipse, rgba(255,197,108,0.12) 0%, transparent 65%);
      animation: drift1 12s ease-in-out infinite;
    }
    .bg-canvas::after {
      content: '';
      position: absolute;
      bottom: 0; right: -10%;
      width: 60%; height: 60%;
      background: radial-gradient(ellipse, rgba(0,237,125,0.06) 0%, transparent 65%);
      animation: drift2 16s ease-in-out infinite;
    }
    @keyframes drift1 {
      0%,100% { transform: translate(0,0); }
      50%      { transform: translate(30px,-40px); }
    }
    @keyframes drift2 {
      0%,100% { transform: translate(0,0); }
      50%      { transform: translate(-20px,30px); }
    }

    /* grain */
    .grain {
      position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* ── Layout ── */
    .page {
      position: relative; z-index: 2;
      width: 100%; max-width: 420px;
      margin: 0 auto;
      padding: max(32px, env(safe-area-inset-top)) 20px max(32px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* ── Hero ── */
    .hero {
      text-align: center;
      padding: 24px 0 32px;
      animation: fadeUp 0.5s ease both;
    }

    .logo-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px; height: 72px;
      border-radius: 22px;
      background: linear-gradient(135deg, #ffc56c, #cb9743);
      box-shadow: 0 0 40px rgba(255,197,108,0.35), 0 16px 40px rgba(0,0,0,0.5);
      margin-bottom: 20px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 900;
      font-size: 26px;
      font-style: italic;
      color: #321f00;
      letter-spacing: -0.04em;
    }

    .hero-eyebrow {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.28em;
      color: rgba(255,197,108,0.6);
      margin-bottom: 10px;
    }

    .hero-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 900;
      font-style: italic;
      font-size: clamp(2.4rem, 10vw, 3.2rem);
      line-height: 0.9;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      color: #e4e1ef;
      margin-bottom: 12px;
    }
    .hero-title .gold { color: #ffc56c; }

    .hero-sub {
      font-size: 13px;
      color: var(--text2);
      font-weight: 500;
    }

    /* ── Card ── */
    .card {
      background: rgba(13,13,23,0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1.5px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
      animation: fadeUp 0.5s ease 0.1s both;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 24px;
    }
    .tab {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--text2);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab.active {
      background: linear-gradient(135deg, #ffc56c, #cb9743);
      color: #321f00;
      box-shadow: 0 4px 16px rgba(255,197,108,0.3);
    }

    /* ── Form ── */
    .form { display: flex; flex-direction: column; gap: 14px; }

    .field { display: flex; flex-direction: column; gap: 6px; }

    .field label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text2);
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrap input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 14px 48px 14px 16px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    .input-wrap input::placeholder { color: rgba(172,169,183,0.4); }
    .input-wrap input:focus { border-color: rgba(255,197,108,0.5); background: rgba(255,197,108,0.04); }
    .input-wrap input.error { border-color: rgba(255,107,107,0.5); }

    .input-icon {
      position: absolute;
      right: 14px;
      color: var(--text2);
      font-size: 18px;
      cursor: pointer;
      user-select: none;
      padding: 4px;
    }

    /* ── Submit Button ── */
    .btn-submit {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #ffc56c, #cb9743);
      color: #321f00;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      margin-top: 4px;
      box-shadow: 0 8px 32px rgba(255,197,108,0.3);
      transition: transform 0.15s, box-shadow 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 54px;
    }
    .btn-submit:active { transform: scale(0.98); box-shadow: 0 4px 16px rgba(255,197,108,0.2); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* ── Messages ── */
    .msg {
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      display: none;
      margin-top: 4px;
    }
    .msg.error {
      display: block;
      background: rgba(255,107,107,0.1);
      border: 1px solid rgba(255,107,107,0.3);
      color: #ff8f8f;
    }
    .msg.success {
      display: block;
      background: rgba(0,237,125,0.08);
      border: 1px solid rgba(0,237,125,0.25);
      color: #00ed7d;
    }

    /* ── Register extra fields ── */
    #register-fields { display: none; flex-direction: column; gap: 14px; }
    #register-fields.visible { display: flex; }

    /* ── Spinner ── */
    .spinner {
      width: 20px; height: 20px;
      border: 2.5px solid rgba(50,31,0,0.3);
      border-top-color: #321f00;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    .footer {
      text-align: center;
      font-size: 11px;
      color: rgba(172,169,183,0.4);
      padding: 20px 0 8px;
      line-height: 1.7;
      animation: fadeUp 0.5s ease 0.2s both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
<div class="bg-canvas"></div>
<div class="grain"></div>

<div class="page">

  <!-- Hero -->
  <div class="hero">
    <div class="logo-mark">90TC</div>
    <p class="hero-eyebrow">90-Tage-Challenge</p>
    <h1 class="hero-title">DEINE<br><span class="gold">TRANSFORMATION</span></h1>
    <p class="hero-sub">Kein Bullshit. Nur Ergebnisse.</p>
  </div>

  <!-- Card -->
  <div class="card">
    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="switchTab('login')">Einloggen</button>
      <button class="tab" id="tab-register" onclick="switchTab('register')">Registrieren</button>
    </div>

    <!-- Form -->
    <form class="form" id="auth-form" onsubmit="handleSubmit(event)" novalidate>

      <!-- Register: Name -->
      <div id="register-fields">
        <div class="field">
          <label>Dein Name</label>
          <div class="input-wrap">
            <input type="text" id="name" placeholder="Max Mustermann" autocomplete="name">
            <span class="input-icon">👤</span>
          </div>
        </div>
      </div>

      <!-- Email -->
      <div class="field">
        <label>E-Mail</label>
        <div class="input-wrap">
          <input type="email" id="email" placeholder="deine@email.de" required autocomplete="email">
          <span class="input-icon">✉</span>
        </div>
      </div>

      <!-- Password -->
      <div class="field">
        <label>Passwort</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="Mindestens 6 Zeichen" required autocomplete="current-password">
          <span class="input-icon" id="pw-toggle" onclick="togglePw()" title="Passwort anzeigen">👁</span>
        </div>
      </div>

      <!-- Message -->
      <div class="msg" id="msg"></div>

      <!-- Submit -->
      <button class="btn-submit" type="submit" id="submit-btn">
        <span id="btn-text">Einloggen</span>
      </button>

    </form>
  </div>

  <div class="footer">
    Dein persönliches Fitness-Tagebuch.<br>Deine Daten. Nur für dich.
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script>
  let currentTab = 'login'

  // Redirect if already logged in
  sb.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = 'index.html'
  })

  function switchTab(tab) {
    currentTab = tab
    document.getElementById('tab-login').classList.toggle('active', tab === 'login')
    document.getElementById('tab-register').classList.toggle('active', tab === 'register')
    document.getElementById('btn-text').textContent = tab === 'login' ? 'Einloggen' : 'Account erstellen'
    document.getElementById('password').autocomplete = tab === 'login' ? 'current-password' : 'new-password'
    const regFields = document.getElementById('register-fields')
    regFields.classList.toggle('visible', tab === 'register')
    clearMsg()
  }

  function togglePw() {
    const inp = document.getElementById('password')
    const icon = document.getElementById('pw-toggle')
    if (inp.type === 'password') { inp.type = 'text'; icon.textContent = '🙈' }
    else { inp.type = 'password'; icon.textContent = '👁' }
  }

  function showMsg(text, type) {
    const el = document.getElementById('msg')
    el.textContent = text
    el.className = 'msg ' + type
  }
  function clearMsg() {
    const el = document.getElementById('msg')
    el.textContent = ''
    el.className = 'msg'
  }

  function setLoading(on) {
    const btn = document.getElementById('submit-btn')
    btn.disabled = on
    if (on) {
      btn.innerHTML = '<div class="spinner"></div>'
    } else {
      btn.innerHTML = `<span id="btn-text">${currentTab === 'login' ? 'Einloggen' : 'Account erstellen'}</span>`
    }
  }

  async function handleSubmit(e) {
    e.preventDefault()
    const email    = document.getElementById('email').value.trim()
    const password = document.getElementById('password').value
    const name     = document.getElementById('name').value.trim()

    if (!email || !password) { showMsg('Bitte E-Mail und Passwort eingeben.', 'error'); return }
    if (password.length < 6) { showMsg('Passwort muss mindestens 6 Zeichen haben.', 'error'); return }

    clearMsg()
    setLoading(true)

    if (currentTab === 'login') {
      const { error } = await sb.auth.signInWithPassword({ email, password })
      if (error) {
        const errMap = {
          'Invalid login credentials': 'E-Mail oder Passwort falsch.',
          'Email not confirmed': 'Bitte erst die E-Mail bestätigen.',
        }
        showMsg(errMap[error.message] || error.message, 'error')
        setLoading(false)
      } else {
        window.location.href = 'index.html'
      }

    } else {
      const meta = name ? { data: { name } } : {}
      const { data, error } = await sb.auth.signUp({ email, password, options: meta })
      setLoading(false)
      if (error) {
        const errMap = {
          'User already registered': 'Diese E-Mail ist bereits registriert. Einfach einloggen.',
        }
        showMsg(errMap[error.message] || error.message, 'error')
      } else if (data?.user?.identities?.length === 0) {
        showMsg('Diese E-Mail ist bereits registriert. Bitte einloggen.', 'error')
      } else {
        showMsg('✓ Account erstellt! Jetzt einloggen.', 'success')
        document.getElementById('password').value = ''
        setTimeout(() => switchTab('login'), 1800)
      }
    }
  }
</script>
</body>
</html>
